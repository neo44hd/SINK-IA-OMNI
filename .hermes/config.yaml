model:
  default: omniroute/auto
  provider: custom:omniroute
  # Política: cloud-free primero (vía OmniRoute), local (LM Studio/Ollama)
  # solo como último recurso. Vision es la excepción (solo hay modelo local).
  aliases:
    opus: omniroute/auto
    sonnet: omniroute/auto
    haiku: omniroute/auto
    fast: omniroute/auto
    coder: omniroute/auto
    reason: omniroute/auto
    vision: lmstudio/qwen/qwen3-vl-4b
  ollama_num_ctx: 65536
  api_key: sk-no-auth
  api_mode: chat_completions
providers:
  omniroute:
    base_url: http://127.0.0.1:9500/v1
    api: http://127.0.0.1:9500/v1
    name: SynK-IA OmniRoute (único hub canónico)
  lmstudio:
    base_url: http://localhost:1234/v1
    api: http://localhost:1234/v1
    name: LM Studio local (7 modelos verificados)
  ollama:
    base_url: http://127.0.0.1:11435/v1
    api: http://127.0.0.1:11435/v1
    name: Ollama local (synk-ia-ollama container)
fallback_providers:
  - name: OmniRoute (cloud-free primero)
    provider: omniroute
    base_url: http://127.0.0.1:9500
    api_key: sk-no-auth
    model: auto
    reason: Hub canónico — política cloud-free primero, local fallback
  - name: LM Studio local
    provider: lmstudio
    base_url: http://localhost:1234/v1
    api_key: lm-studio
    model: zai-org/glm-4.6v-flash
    reason: Coder+reasoning local, cero costo
  - name: Ollama local
    provider: ollama
    base_url: http://127.0.0.1:11435/v1
    api_key: ollama
    model: llama3.2:3b
    reason: 3B ligero, realtime/lightweight
agent:
  restart_drain_timeout: 30
  reasoning_effort: minimal
terminal:
  backend: daytona
web:
  search_backend: ddgs
compression:
  threshold: 0.85
display:
  language: es
wake_word:
  enabled: true
approvals:
  destructive_slash_confirm: false
command_allowlist:
  - pipe remote content to shell
  - overwrite project env/config via redirection
  - script execution via heredoc
  - tirith:raw_ip_url
  - docker restart/stop/kill (container lifecycle)
  - tirith:plain_http_to_sink
  - tirith:private_network_access
  - hermes update (restarts gateway, kills running agents)
  - script execution via -e/-c flag
  - shell command via -c/-lc flag
onboarding:
  seen:
    openclaw_residue_cleanup: true
    tool_progress_prompt: true
    busy_input_prompt: true
_config_version: 37
# Providers nativos. Listas limpiadas (2026-09-24) para no heredar modelos
# muertos/inexistentes. cloud-free primero, local al final.
custom_providers:
  - name: OmniRoute (único hub)
    slug: omniroute
